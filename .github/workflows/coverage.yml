name: Test and Update Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.0"

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Generate coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | tr -d '%')
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

          # Create badge JSON
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"brightgreen\"}" > badge.json

          # Update README badge - now pointing to coverage.out instead of coverage.html
          sed -i "s/Coverage-[0-9.]*%25/Coverage-${COVERAGE}%25/g" README.md

      - name: Commit updated coverage badge
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md badge.json coverage.html coverage.out
          git commit -m "Update coverage badge to ${COVERAGE}%" || echo "No changes to commit"
          git push
